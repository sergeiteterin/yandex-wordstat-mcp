[project]
name = "yandex-wordstat-mcp"
version = "0.1.0"
description = "MCP server for Yandex Wordstat search statistics via the Yandex Cloud Search API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27",
]
keywords = ["mcp", "yandex", "wordstat", "seo", "keyword-research"]

[project.scripts]
yandex-wordstat-mcp = "yandex_wordstat_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
